services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  fairly:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      FAIRLY_CONFIG: /app/fairly.config.json
      FAIRLY_FAILURE_MODE: ${FAIRLY_FAILURE_MODE:-fail-open}
      FAIRLY_FAIL_CLOSED_RETRY_AFTER_SECONDS: ${FAIRLY_FAIL_CLOSED_RETRY_AFTER_SECONDS:-1}
      FAIRLY_ADMIN_TOKEN: ${FAIRLY_ADMIN_TOKEN:-}
      FAIRLY_SHUTDOWN_TIMEOUT_MS: ${FAIRLY_SHUTDOWN_TIMEOUT_MS:-10000}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-1000}
      POLICY_REFRESH_MS: ${POLICY_REFRESH_MS:-2000}
      LOG_LEVEL: ${LOG_LEVEL:-warn}
    stop_grace_period: 20s
    ports:
      - "8080:8080"
